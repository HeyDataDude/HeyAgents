[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "council-api"
version = "0.1.0"
description = "Council — voice-first personal cognitive OS of persistent specialist AI agents."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy[asyncio]>=2.0.30",
    "alembic>=1.13",
    "asyncpg>=0.29",
    "psycopg[binary]>=3.1",
    "pgvector>=0.3.0",
    "redis>=5.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "structlog>=24.1",
    "boto3>=1.34",
    "python-dateutil>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "aiosqlite>=0.20",
    "ruff>=0.4",
    "mypy>=1.10",
    "httpx>=0.27",
]
# Optional heavy integrations — only installed when running in "live" mode.
live = [
    "faster-whisper>=1.0",
    "openai>=1.30",
    "letta-client>=0.1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "B008",   # FastAPI Depends() in defaults is idiomatic
    "UP042",  # explicit str+Enum base kept for clarity/compat
    "B905",   # zip() strict= not required for our fixed-length pairs
    "E501",   # long strings in tests/seed are acceptable
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B017", "F841"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
